spring.application.name=SoftCorpBackend
server.port=${PORT:8080}

# Lee las variables del archivo .env en local
spring.config.import=optional:file:.env[.properties]

# Base de datos PostgreSQL en Neon
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# Crea tablas/columnas nuevas al arrancar
spring.sql.init.mode=always
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# JWT
jwt.secret=${TOKEN_JWT_SECRET:c29mdGNvcnAtY2xhdmUtZGUtcHJ1ZWJhcy1zb2xvLXBhcmEtZGVzYXJyb2xsby0xMjM0NTY3ODk=}
jwt.expiration=3600000

# CORS (soporta múltiples orígenes separados por coma)
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:4200}

# Swagger (alineado con SIGCON)
springdoc.swagger-ui.path=/docs
springdoc.api-docs.enabled=${SPRINGDOC_ENABLED:true}
springdoc.swagger-ui.enabled=${SPRINGDOC_ENABLED:true}

# Auditoría y proxy de Render
app.version=1.0.0
app.description=Sistema web para la gestión de incidencias de Soporte y Sistemas - Soft Corporation
server.forward-headers-strategy=FRAMEWORK

# Actuator (Health Check de Render)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized
management.info.env.enabled=true

info.app.name=${spring.application.name}
info.app.description=${app.description}
info.app.version=${app.version}
