spring.application.name=SoftCorpBackend
server.port=8080

# Lee las variables del archivo .env
spring.config.import=optional:file:.env[.properties]

# Base de datos.
# - Si existe el archivo .env, usa PostgreSQL con esos datos.
# - Si NO existe, usa H2: una base temporal en memoria (se borra al apagar el backend).
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:softcorp;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# Crea las tablas (schema.sql) y carga los datos iniciales (data.sql) al arrancar
spring.sql.init.mode=always
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# JWT: clave secreta en Base64 y duración del token (1 hora en milisegundos).
jwt.secret=${TOKEN_JWT_SECRET:c29mdGNvcnAtY2xhdmUtZGUtcHJ1ZWJhcy1zb2xvLXBhcmEtZGVzYXJyb2xsby0xMjM0NTY3ODk=}
jwt.expiration=3600000

# Origen permitido para el frontend de Angular
app.cors.allowed-origin=http://localhost:4200
